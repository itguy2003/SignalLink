; NOTE: Alembic reads this file with the system locale encoding (cp949 on a
; Korean Windows install), so this file must stay ASCII-only. Korean comments
; belong in alembic/env.py, which is read as UTF-8.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
; sqlalchemy.url is filled in by alembic/env.py from app.core.config.
; Hardcoding it here would break the dev(SQLite)/prod(PostgreSQL) switch.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
